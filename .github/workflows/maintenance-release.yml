name: Maintenance Release from Tag

# Patches an older release line. Push a fix to release/vX.Y.Z or hotfix/vX.Y.Z
# and this cuts the next version *within that line* — v0.1.4 -> v0.1.5 — no
# matter how far main has moved on. The resulting GitHub Release drives
# release-publish.yml, which publishes the packages under a v<major>.<minor>
# dist-tag so an old patch never becomes npm `latest`.
#
# Release branches are created automatically for every release by
# versioning.yml. To patch a tag that predates these workflows, start the
# branch with hotfix-from-tag.yml.
#
#   [minor] on a release/** branch -> vX.Y+1.0
#   anything else                  -> vX.Y.Z+1

on:
  push:
    branches: ['release/**', 'hotfix/**']

permissions:
  contents: write

concurrency:
  group: maintenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  maintenance-release:
    runs-on: ubuntu-latest
    # `created` skips the branch-creation push itself: opening release/v1.2.3
    # or a hotfix branch should not immediately cut another version — the first
    # real commit pushed to it does. `deleted` pushes carry no commit at all.
    if: |
      github.event.created == false &&
      github.event.deleted == false &&
      !contains(github.event.head_commit.message, '[dirty]') &&
      !contains(github.event.head_commit.message, '[skip release]')

    steps:
      # PAT_TOKEN so that the tag and Release created here trigger
      # release-publish.yml (GITHUB_TOKEN-authored events do not).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          token: ${{ secrets.PAT_TOKEN }}

      # registry-url + scope write the npm.pkg.github.com auth line into the
      # runner's npmrc for the Lerna step below — `lerna version` regenerates
      # the lockfile with npm, which needs the private
      # @blue-orange-ai/primitives-* packages when the lockfile has drifted.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@blue-orange-ai'

      - name: Check registry credentials
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [ -z "$PAT_TOKEN" ]; then
            echo "::error::secrets.PAT_TOKEN is not set. It is needed to push the release and to"
            echo "::error::read the private @blue-orange-ai/primitives-* packages when Lerna"
            echo "::error::re-syncs the lockfile. See .github/workflows/README.md."
            exit 1
          fi

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Extract base version from branch name
        id: extract_version
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if [[ $BRANCH_NAME =~ ^(release|hotfix)/v?([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "branch_type=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
            echo "base_version=v${BASH_REMATCH[2]}.${BASH_REMATCH[3]}.${BASH_REMATCH[4]}" >> $GITHUB_OUTPUT
            echo "major=${BASH_REMATCH[2]}" >> $GITHUB_OUTPUT
            echo "minor=${BASH_REMATCH[3]}" >> $GITHUB_OUTPUT
          else
            echo "Branch name must follow 'release/v1.2.3' or 'hotfix/v1.2.3'"
            exit 1
          fi

      # The line's head, not the branch name: release/v0.1.0 that has already
      # been patched three times must bump from v0.1.3, not from v0.1.0.
      - name: Find latest patch in this version line
        id: latest_patch
        run: |
          MAJOR="${{ steps.extract_version.outputs.major }}"
          MINOR="${{ steps.extract_version.outputs.minor }}"
          LATEST_PATCH=$(git tag -l "v${MAJOR}.${MINOR}.*" | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+$" | sort -V | tail -1)
          echo "latest_patch=${LATEST_PATCH:-${{ steps.extract_version.outputs.base_version }}}" >> $GITHUB_OUTPUT

      # Commit messages are attacker-controlled free text: they routinely
      # contain backticks, quotes and $(...) that the shell would execute if
      # the value were interpolated into the script. Pass them through the
      # environment, where the runner never parses them.
      - name: Determine version bump
        id: version_bump
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          BRANCH_TYPE: ${{ steps.extract_version.outputs.branch_type }}
        run: |
          if echo "$HEAD_COMMIT_MESSAGE" | grep -qE "^\[minor\]" && [ "$BRANCH_TYPE" = "release" ]; then
            echo "bump_type=minor" >> $GITHUB_OUTPUT
          else
            echo "bump_type=patch" >> $GITHUB_OUTPUT
          fi

      - name: Calculate maintenance version
        id: maintenance_version
        run: |
          LATEST_PATCH="${{ steps.latest_patch.outputs.latest_patch }}"
          BUMP_TYPE="${{ steps.version_bump.outputs.bump_type }}"
          if [[ $LATEST_PATCH =~ ^v?([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            MAJOR=${BASH_REMATCH[1]}; MINOR=${BASH_REMATCH[2]}; PATCH=${BASH_REMATCH[3]}
          else
            echo "Cannot parse $LATEST_PATCH as a version"
            exit 1
          fi
          case $BUMP_TYPE in
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          echo "new_version=v${MAJOR}.${MINOR}.${PATCH}" >> $GITHUB_OUTPUT
          echo "plain_version=${MAJOR}.${MINOR}.${PATCH}" >> $GITHUB_OUTPUT

      - name: Fail if tag already exists
        run: |
          NEW_VERSION="${{ steps.maintenance_version.outputs.new_version }}"
          if git rev-parse -q --verify "refs/tags/$NEW_VERSION" >/dev/null; then
            echo "Tag $NEW_VERSION already exists — refusing to overwrite it."
            exit 1
          fi

      # Same Lerna mechanics as versioning.yml: rewrites lerna.json, all 16
      # package.json files and the internal ^X.Y.Z ranges, then commits + tags.
      # NODE_AUTH_TOKEN for the lockfile regeneration Lerna runs at the end
      # (see the setup-node comment above).
      - name: Bump all packages with Lerna
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          npx --yes lerna@8.2.4 version "${{ steps.maintenance_version.outputs.plain_version }}" \
            --force-publish \
            --no-push \
            --yes \
            --message "chore(${{ steps.extract_version.outputs.branch_type }}): %s [skip ci]"

      - name: Push commit and tag
        run: |
          git push origin "HEAD:refs/heads/${{ github.ref_name }}"
          git push origin "refs/tags/${{ steps.maintenance_version.outputs.new_version }}"

      - name: Build release notes
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          {
            echo "## Maintenance Release"
            echo
            echo "${{ steps.extract_version.outputs.branch_type }} on the \`${{ github.ref_name }}\` branch, patching the ${{ steps.extract_version.outputs.base_version }} line."
            echo
            echo "## Changes"
            echo
            echo "$HEAD_COMMIT_MESSAGE"
            echo
            echo "## Version"
            echo "- Previous in line: ${{ steps.latest_patch.outputs.latest_patch }}"
            echo "- New: ${{ steps.maintenance_version.outputs.new_version }}"
          } > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.PAT_TOKEN }}
          tag_name: ${{ steps.maintenance_version.outputs.new_version }}
          name: ${{ steps.extract_version.outputs.branch_type }} ${{ steps.maintenance_version.outputs.new_version }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ steps.extract_version.outputs.branch_type == 'hotfix' }}
